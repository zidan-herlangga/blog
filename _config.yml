title: "Zidan Herlangga — Blog"
description: "Catatan, tulisan, dan eksperimen seputar web development, keamanan siber, dan teknologi."
# Situs ini disajikan sebagai project page: https://<user>.github.io/blog/
url: "https://zidan-herlangga.github.io"
baseurl: "/blog"
author: "Zidan Herlangga"
email: "zidanherlangga24@gmail.com"
lang: id
locale: id_ID

# SEO: dipakai jekyll-seo-tag untuk og:image default & twitter card
logo: /assets/images/og-default.png
twitter:
  card: summary_large_image
  username: dansec04_
social:
  name: Zidan Herlangga
  links:
    - https://zidanherlangga.vercel.app
    - https://github.com/zidan-herlangga
    - https://www.instagram.com/zidanherlangga_
    - https://www.linkedin.com/in/zidanherlangga
    - https://x.com/dansec04_

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Plugins (didukung GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Komentar (utterances, berbasis GitHub Issues — tanpa database)
comments:
  enabled: true
  repo: "zidan-herlangga/blog"
  issue_term: "pathname"
  label: ""
  theme_light: "github-light"
  theme_dark: "github-dark"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Gambar OG default untuk semua halaman & artikel
# (artikel yang punya `image:` di front matter tetap menang)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/images/og-default.png
