title: "Zidan Herlangga — Blog"
description: "Catatan, tulisan, dan eksperimen seputar web development, keamanan siber, dan teknologi."
baseurl: ""
url: "https://zidanherlangga.github.io"
author: "Zidan Herlangga"
email: "zidanherlangga24@gmail.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# Plugins (supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
