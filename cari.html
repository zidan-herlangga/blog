---
layout: default
title: Cari
description: "Cari tulisan di blog Zidan Herlangga: judul, kategori, ringkasan."
permalink: /cari/
---

<section class="search-page">
  <h1>Cari tulisan</h1>
  <p class="search-page__lead">Ketik kata kunci – judul, kategori, atau ringkasan.</p>

  <form class="search-form" id="searchForm" role="search">
    <label class="sr-only" for="searchInput">Kata kunci pencarian</label>
    <input
      type="search"
      id="searchInput"
      class="search-form__input"
      placeholder="Contoh: ransomware, Linux, Cursor..."
      autocomplete="off"
      autofocus>
    <button type="button" class="search-form__clear" id="searchClear" aria-label="Bersihkan pencarian" hidden>✕</button>
  </form>

  <div class="search-filters" id="searchFilters" hidden>
    <span class="search-filters__label">Kategori</span>
    <div class="search-filters__chips" id="searchChips" role="group" aria-label="Filter kategori"></div>
  </div>

  <p class="search-page__status" id="searchStatus" role="status" aria-live="polite">Memuat indeks...</p>

  <noscript>
    <p class="search-page__status">
      Pencarian memerlukan JavaScript. Sementara itu, telusuri
      <a href="{{ '/arsip/' | relative_url }}">arsip</a> atau
      <a href="{{ '/kategori/' | relative_url }}">kategori</a>.
    </p>
  </noscript>

  <div class="search-results" id="searchResults"></div>
</section>

<script type="application/json" id="catData">
[
  {%- assign _cps = site.pages | where: "layout", "category" | sort: "title" -%}
  {%- for cp in _cps -%}
  { "slug": {{ cp.category | jsonify }}, "name": {{ cp.title | jsonify }} }{% unless forloop.last %},{% endunless %}
  {%- endfor -%}
]
</script>

<script>
(function () {
  const form = document.getElementById('searchForm');
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('searchClear');
  const status = document.getElementById('searchStatus');
  const results = document.getElementById('searchResults');
  const filters = document.getElementById('searchFilters');
  const chips = document.getElementById('searchChips');
  if (!form || !input || !results) return;

  let posts = [];
  let ready = false;
  let activeCat = '';

  let catNames = {};
  try {
    const raw = document.getElementById('catData');
    if (raw) {
      JSON.parse(raw.textContent).forEach((c) => { catNames[c.slug] = c.name; });
    }
  } catch (e) { /* abaikan */ }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function labelOf(slug) { return catNames[slug] || slug; }

  function countsByCat() {
    const counts = {};
    posts.forEach((p) => (p.categories || []).forEach((c) => { counts[c] = (counts[c] || 0) + 1; }));
    return counts;
  }

  function renderChips() {
    if (!chips) return;
    const counts = countsByCat();
    const slugs = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (!slugs.length) { if (filters) filters.hidden = true; return; }
    let html = '<button type="button" class="search-chip" data-cat="" aria-pressed="' + (activeCat === '' ? 'true' : 'false') + '">Semua</button>';
    slugs.forEach((slug) => {
      html += `<button type="button" class="search-chip" data-cat="${escapeHtml(slug)}" aria-pressed="${activeCat === slug ? 'true' : 'false'}">${escapeHtml(labelOf(slug))} <span class="side-count">${counts[slug]}</span></button>`;
    });
    chips.innerHTML = html;
    if (filters) filters.hidden = false;
    chips.querySelectorAll('.search-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat;
        updateUrl();
        render(input.value);
      });
    });
  }

  function updateChipsPressed() {
    if (!chips) return;
    chips.querySelectorAll('.search-chip').forEach((btn) => {
      btn.setAttribute('aria-pressed', btn.dataset.cat === activeCat ? 'true' : 'false');
    });
  }

  function render(q) {
    if (!ready) return;
    const query = q.trim().toLowerCase();
    if (clear) clear.hidden = !query && !activeCat;
    updateChipsPressed();

    const hits = posts.filter((p) => {
      const hay = [p.title, p.description, (p.categories || []).join(' ')].join(' ').toLowerCase();
      const qOk = !query || hay.includes(query);
      const cOk = !activeCat || (p.categories || []).includes(activeCat);
      return qOk && cOk;
    });

    if (!query && !activeCat) {
      results.innerHTML = '';
      status.textContent = posts.length + ' tulisan terindeks. Ketik atau pilih kategori untuk memfilter.';
      return;
    }

    status.textContent = hits.length === 0
      ? `Tidak ada hasil${query ? ' untuk "' + query + '"' : ''}${activeCat ? ' di kategori ' + labelOf(activeCat) : ''}.`
      : `${hits.length} hasil${query ? ' untuk "' + query + '"' : ''}${activeCat ? ' · ' + labelOf(activeCat) : ''}.`;

    results.innerHTML = hits.map((p) => `
      <a class="search-result" href="${escapeHtml(p.url)}">
        <span class="search-result__media">
          <img src="${escapeHtml(p.thumb || p.image)}" alt="" loading="lazy" decoding="async">
        </span>
        <span class="search-result__body">
          <span class="search-result__meta">${escapeHtml(p.date)} · ${(p.categories || []).map(escapeHtml).map((c) => labelOf(c)).join(', ')}</span>
          <span class="search-result__title">${escapeHtml(p.title)}</span>
          <span class="search-result__excerpt">${escapeHtml(p.description || '')}</span>
        </span>
      </a>
    `).join('');
  }

  function updateUrl() {
    try {
      const url = new URL(location.href);
      if (input.value.trim()) url.searchParams.set('q', input.value.trim()); else url.searchParams.delete('q');
      if (activeCat) url.searchParams.set('kategori', activeCat); else url.searchParams.delete('kategori');
      history.replaceState(null, '', url);
    } catch (e) { /* abaikan */ }
  }

  fetch('{{ "/search.json" | relative_url }}')
    .then((r) => r.json())
    .then((data) => {
      posts = Array.isArray(data) ? data : [];
      ready = true;
      const params = new URLSearchParams(location.search);
      const q = params.get('q');
      const k = params.get('kategori');
      if (q) input.value = q;
      if (k && catNames[k]) activeCat = k;
      renderChips();
      render(input.value);
    })
    .catch(() => { status.textContent = 'Gagal memuat indeks pencarian.'; });

  input.addEventListener('input', () => { updateUrl(); render(input.value); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    updateUrl();
    render(input.value);
  });

  if (clear) {
    clear.addEventListener('click', () => {
      input.value = '';
      input.focus();
      updateUrl();
      render('');
    });
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      input.value = '';
      updateUrl();
      render('');
    }
  });
})();
</script>
